<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Difference Checker</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:25px}
main{max-width:800px;margin:auto;background:white;padding:30px;border-radius:16px}
textarea{width:100%;height:150px;padding:12px;box-sizing:border-box;margin:10px 0;border:1px solid #94a3b8;border-radius:8px}
button{background:#334155;color:white;padding:13px 20px;border:0;border-radius:8px;cursor:pointer}
.change{background:#fef3c7;padding:15px;margin:10px 0;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Text Difference Checker</h1>
<p>Compare corresponding lines in two text documents.</p>
<textarea id="original" placeholder="Original text"></textarea>
<textarea id="modified" placeholder="Modified text"></textarea>
<button onclick="compare()">Compare Text</button>
<h3 id="summary"></h3>
<div id="result"></div>
</main>
<script>
function compare(){
 const a=document.getElementById("original").value.split(/\r?\n/);
 const b=document.getElementById("modified").value.split(/\r?\n/);
 const result=document.getElementById("result");
 result.innerHTML="";
 let changes=0;
 for(let i=0;i<Math.max(a.length,b.length);i++){
  if(a[i]!==b[i]){
   changes++;
   const div=document.createElement("div");
   div.className="change";
   div.textContent="Line "+(i+1)+
   "\nOriginal: "+(a[i]??"(missing)")+
   "\nModified: "+(b[i]??"(missing)");
   result.appendChild(div);
  }
 }
 document.getElementById("summary").textContent=
 changes?changes+" differing line positions":"Both texts are identical.";
}
</script>
</body>
</html>
