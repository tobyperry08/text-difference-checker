<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Difference Checker</title>
<style>
body{font-family:Arial;background:#f8fafc;padding:25px}
main{max-width:750px;margin:auto;background:white;padding:25px;border-radius:15px}
textarea{width:100%;height:130px;padding:12px;box-sizing:border-box;margin:8px 0}
button{padding:12px 18px;background:#334155;color:white;border:0;border-radius:7px;cursor:pointer}
#result{background:#e2e8f0;padding:15px;margin-top:15px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Text Difference Checker</h1>
<label>Original Text</label>
<textarea id="first" placeholder="Enter original text"></textarea>
<label>Updated Text</label>
<textarea id="second" placeholder="Enter updated text"></textarea>
<button onclick="compare()">Compare Text</button>
<div id="result">Comparison results will appear here.</div>
</main>
<script>
function compare(){
 const a=document.getElementById("first").value;
 const b=document.getElementById("second").value;
 const out=document.getElementById("result");
 if(!a&&!b){out.textContent="Enter text in at least one box.";return;}
 const oldLines=a.split(/\r?\n/);
 const newLines=b.split(/\r?\n/);
 const removed=oldLines.filter(line=>!newLines.includes(line));
 const added=newLines.filter(line=>!oldLines.includes(line));
 out.textContent=
 "Removed lines:\n"+(removed.join("\n")||"None")+
 "\n\nAdded lines:\n"+(added.join("\n")||"None");
}
</script>
</body>
</html>
